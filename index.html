<title>सब्ज़ी बिल</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;700;800&family=Yatra+One&display=swap">
<style>
/* Layout: one narrow column, big touch targets, bottom tabs; sticky green total bar on the bill screen */
:root{
  --bg:#f2f6ee; --surface:#ffffff; --ink:#1b2a1e; --muted:#5d6f60; --line:#d8e2d2;
  --accent:#2e7d3a; --on-accent:#ffffff; --soft:#e4efdf; --due:#c0392b; --due-soft:#fbe7e3;
  --font-body:'Mukta',system-ui,-apple-system,'Noto Sans Devanagari',sans-serif;
  --font-display:'Yatra One','Mukta',serif; --tabh:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121a14; --surface:#1a251d; --ink:#e7efe6; --muted:#9bb09d; --line:#2b3a2e;
    --accent:#5fbf6e; --on-accent:#0f1d12; --soft:#223427; --due:#ff8a78; --due-soft:#3a1f1b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121a14; --surface:#1a251d; --ink:#e7efe6; --muted:#9bb09d; --line:#2b3a2e;
  --accent:#5fbf6e; --on-accent:#0f1d12; --soft:#223427; --due:#ff8a78; --due-soft:#3a1f1b; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;padding-inline:16px;padding-block:0}
.wrap{max-width:560px;margin:0 auto;padding-bottom:150px}
.hd{padding-block:18px 10px}
.hd h1{font-family:var(--font-display);font-weight:400;font-size:26px;margin:0;color:var(--accent);text-wrap:balance}
.hd p{margin:2px 0 0;color:var(--muted);font-size:14px}
h2{font-size:20px;margin:18px 0 10px;font-weight:800}
h3{font-size:17px;margin:0 0 10px;font-weight:800}
small,.small{font-size:13px;color:var(--muted)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{height:46px;width:100%;min-width:0;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{height:96px;padding:10px 12px;font-size:13px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:500}
.selrow{display:flex;gap:8px}
.bal{margin:8px 0 0;font-size:14px;color:var(--muted)}
.bal b{color:var(--due)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.big{width:100%;margin-top:12px;min-height:52px;font-size:18px}
.btn.wa{background:#1e9e4f;color:#fff}
.btn.armed,.link.armed{background:var(--due);color:#fff}
.link{border:0;background:none;color:var(--due);font-weight:700;padding:8px 6px;min-height:40px;cursor:pointer}
.search{margin:4px 0 10px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.row.on{border-color:var(--accent);background:var(--soft)}
.row .top{display:flex;align-items:center;gap:8px}
.row .nm{flex:1;font-weight:800;font-size:19px;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .amt{text-align:right;font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.row .rm{width:36px;height:36px;flex:none;border:0;border-radius:999px;background:var(--due-soft);color:var(--due);font-size:22px;line-height:1;cursor:pointer}
.row .ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pickbtn{width:100%;margin:0 0 10px;min-height:50px;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.rt{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:14px}
.rt input{width:78px;text-align:center;font-weight:700;color:var(--ink)}
.step{display:flex;gap:6px;margin-left:auto}
.step button{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:24px;font-weight:700;cursor:pointer;color:var(--accent)}
.step input{width:84px;text-align:center;font-weight:800;font-size:19px}
.tag{border:0;border-radius:999px;background:var(--due-soft);color:var(--due);font-size:12px;font-weight:700;padding:3px 10px;cursor:pointer}
.sum{margin:0;display:flex;flex-direction:column;gap:6px}
.sum>div{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sum dt{color:var(--muted)}
.sum dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.sum .inrow dd{width:130px}
.sum .inrow input{text-align:right;font-weight:700}
.sum .due{border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.sum .due dt{color:var(--ink);font-weight:800}
.sum .due dd{font-size:24px;font-family:var(--font-display);font-weight:400;color:var(--due)}
.totbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--on-accent);padding:10px 16px}
.totbar>div{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.totbar b{display:block;font-family:var(--font-display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.totbar span{font-size:13px;opacity:.9}
.totbar .btn{background:var(--on-accent);color:var(--accent)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs>div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{height:var(--tabh);border:0;background:none;font-weight:700;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
.tabs button.on{color:var(--accent);border-top-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;max-width:90vw}
.grid2{display:grid;grid-template-columns:1fr 110px;gap:8px}
.grid3{display:grid;grid-template-columns:1fr;gap:8px}
.edrow{display:grid;grid-template-columns:1fr 92px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.edrow:last-child{border-bottom:0}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--due-soft);color:var(--due);font-weight:800;font-variant-numeric:tabular-nums}
.pill.ok{background:var(--soft);color:var(--accent)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.ud{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.ud:last-child{border-bottom:0}
.ud .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ud .act{display:flex;gap:8px}
.ud .act input{flex:1}
.hist{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.hist button.open{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.hist .t{font-weight:700;overflow-wrap:anywhere}
table.bill{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.bill td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.bill thead td{border-bottom:2px solid var(--line);padding-bottom:8px}
table.bill td:first-child{width:28px;color:var(--muted);font-weight:700}
table.bill td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:18px 8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts>*{flex:1 1 140px}
@media (prefers-reduced-motion:no-preference){.row,.btn{transition:background .15s,border-color .15s}}
.login{text-align:center;margin-top:30px}.login p{margin:8px 0 0}
</style>

<div class="wrap">
  <header class="hd"><h1 id="shopName"></h1><p id="dateLine"></p></header>
  <main id="main"></main>
</div>
<div class="totbar" id="totbar" hidden>
  <div><div style="display:block"><span>इस बिल का कुल</span><b id="stTotal">₹0</b></div><button class="btn" data-act="toSummary">बिल बनाएँ</button></div>
</div>
<nav class="tabs" id="tabs"><div>
  <button data-tab="bill" class="on">बिल</button>
  <button data-tab="rates">रेट</button>
  <button data-tab="cust">ग्राहक</button>
  <button data-tab="hisaab">हिसाब</button>
</div></nav>
<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
var KEY='sabzi_bill_v1';
var $=function(s){return document.querySelector(s)};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var num=function(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0};
var rnd=function(n){return Math.round(n*100)/100};
var fmtN=function(n){return rnd(n).toLocaleString('en-IN',{maximumFractionDigits:2})};
var fmt=function(n){return '₹'+fmtN(n)};
var todayISO=function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
var dmy=function(iso){return String(iso).split('-').reverse().join('/')};
var set=function(s,v){var e=$(s);if(e)e.textContent=v};

var VEG_CATALOG=[
  ['मौसमी पत्ता',30],['पालक पत्ता',30],['आलू',20],['प्याज',30],['देसी तोरी',40],['छोटी प्याज',40],
  ['फूल गोभी',40],['करेला',50],['लौकी देसी',30],['लौकी पहाड़ी',35],['अरबी',50],['शलगम',30],
  ['शिमला मिर्च',60],['भिंडी',50],['मिर्च',80],['बैंगन देसी',40],['बैंगन गोल-लंबा',40],['तोरी',40],
  ['परवल देसी',60],['गिलकी',40],['टमाटर',40],['पालक',30],['देसी खीरा',30],['हाइब्रिड खीरा',40],
  ['धनिया',100],['चौलाई पत्ता',30],['टिंडा',60],['कद्दू',25],['गोल मिर्च',80],['हरी मिर्च',80],
  ['मूली',25],['गवार फली',50],['सेम फली',50],['लंबा बैंगन',40],['गोल बैंगन',40],['गाजर',40],
  ['हल्दी',80],['मटर',80],['नींबू',100],['अदरक',120],['पुदीना',80],['हरा प्याज',40],['परवल हाइब्रिड',60]
];
function vegFromCatalog(){return VEG_CATALOG.map(function(x){return {id:uid(),name:x[0],rate:x[1]}})}
function mergeVeg(list){
  var byName={};
  (list||[]).forEach(function(v){if(v&&v.name&&!byName[v.name])byName[v.name]=v});
  var out=[];
  VEG_CATALOG.forEach(function(x){
    var old=byName[x[0]];
    if(old){out.push(old);delete byName[x[0]]}
    else out.push({id:uid(),name:x[0],rate:x[1]});
  });
  Object.keys(byName).forEach(function(n){out.push(byName[n])});
  return out;
}
function seed(){
  return {shop:'पांडे जी सब्ज़ी',vegMerged:true,
    veg:vegFromCatalog(),
    customers:[],
    bills:[],payments:[]};
}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.veg&&o.customers&&o.bills){o.payments=o.payments||[];if(o.shop==='मेरी सब्ज़ी दुकान'||!o.shop)o.shop='पांडे जी सब्ज़ी';if(!o.vegMerged){o.veg=mergeVeg(o.veg);o.vegMerged=true}return o}}}catch(e){}return seed()}
function save(){if(cloud.on){cloudSaveCore();return}try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var cloud={on:false,local:false,uid:null,email:'',ref:null};
var S=load();
save();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
var ui={tab:'bill',view:'edit',custId:null,w:{},sel:[],picking:false,baki:'',paid:'',previewId:null,bakiTouched:false};

function cust(){var c=S.customers.find(function(x){return x.id===ui.custId});if(!c){c=S.customers[0];ui.custId=c?c.id:null}return c}
function vegById(id){return S.veg.find(function(v){return v.id===id})}
function effRate(v,c){return c&&c.rates&&c.rates[v.id]!=null?c.rates[v.id]:v.rate}
function billVeg(x){return x.baki!=null?num(x.sub):num(x.total)}
function balance(c){
  var b=num(c.opening);
  S.bills.forEach(function(x){if(x.custId===c.id)b+=billVeg(x)-x.paid});
  S.payments.forEach(function(p){if(p.custId===c.id)b-=p.amt});
  return rnd(b);
}
function calc(){
  var c=cust(),items=[],sub=0;
  ui.sel.forEach(function(id){var v=vegById(id);if(!v)return;var kg=num(ui.w[id]);if(kg>0){var r=effRate(v,c),amt=rnd(kg*r);items.push({name:v.name,kg:kg,rate:r,amt:amt});sub+=amt}});
  var prev=c?balance(c):0;
  if(!ui.bakiTouched)ui.baki=prev?String(prev):'';
  var baki=num(ui.baki),paid=num(ui.paid),vegTotal=rnd(sub),total=rnd(vegTotal+baki);
  return {items:items,sub:vegTotal,baki:baki,minus:0,total:total,paid:paid,prev:baki,due:rnd(total-paid)};
}
function phoneNorm(p){var d=String(p||'').replace(/\D/g,'').replace(/^0+/,'');if(d.length===10)return '91'+d;if(d.length===12&&d.indexOf('91')===0)return d;if(d.length>=11)return d;return ''}
function waLink(phone,text){return 'https://wa.me/'+phoneNorm(phone)+'?text='+encodeURIComponent(text)}
function billMsg(b){
  var L=['*'+S.shop+'*','ग्राहक: '+b.custName,'तारीख: '+dmy(b.date),''];
  b.items.forEach(function(i,idx){L.push((idx+1)+'. '+i.name+' - '+fmtN(i.kg)+' kg × ₹'+fmtN(i.rate)+' = ₹'+fmtN(i.amt))});
  L.push('');L.push('सब्ज़ी का कुल: ₹'+fmtN(b.sub));
  if(b.baki)L.push('बाकी: ₹'+fmtN(b.baki));else if(b.prev)L.push('पिछला बाकी: ₹'+fmtN(b.prev));
  if(b.minus)L.push('घटाया: -₹'+fmtN(b.minus));
  L.push('*इस बिल का कुल: ₹'+fmtN(b.total)+'*');
  if(b.paid)L.push('अभी मिले: ₹'+fmtN(b.paid));
  L.push('*कुल बाकी: ₹'+fmtN(b.due)+'*');L.push('');L.push('धन्यवाद');
  return L.join('\n');
}
/* bill as a picture, drawn like the on-screen bill */
function billImage(b){
  var fonts=(document.fonts&&document.fonts.load)?Promise.race([Promise.all([document.fonts.load('500 20px Mukta'),document.fonts.load('800 20px Mukta'),document.fonts.load('400 30px "Yatra One"')]),new Promise(function(r){setTimeout(r,1500)})]).catch(function(){}):Promise.resolve();
  return fonts.then(function(){
    var W=720,pad=28,rowH=42,K=2,items=b.items,bakiAmt=b.baki!=null?num(b.baki):0;
    var lines=[['सब्ज़ी का कुल',fmt(b.sub),0]];
    if(bakiAmt)lines.push(['बाकी',fmt(bakiAmt),0]);
    if(b.minus)lines.push(['घटाया','-'+fmt(b.minus),0]);
    if(b.baki==null&&b.prev)lines.push(['पिछला बाकी',fmt(b.prev),0]);
    lines.push(['इस बिल का कुल',fmt(b.total),1]);
    if(b.paid)lines.push(['अभी मिले',fmt(b.paid),0]);
    var H=40+44+30+24+16+rowH+items.length*rowH+18+lines.length*34+26+64+46;
    var cv=document.createElement('canvas');cv.width=W*K;cv.height=H*K;
    var x=cv.getContext('2d');x.scale(K,K);
    var BG='#ffffff',INK='#1b2a1e',MUT='#5d6f60',LINE='#d8e2d2',ACC='#2e7d3a',DUE='#c0392b';
    var F="'Mukta','Noto Sans Devanagari','Nirmala UI',sans-serif",FD="'Yatra One','Mukta','Noto Sans Devanagari',serif";
    x.fillStyle=BG;x.fillRect(0,0,W,H);
    var T=function(t,px,py,font,col,al){x.font=font;x.fillStyle=col;x.textAlign=al||'left';x.textBaseline='alphabetic';x.fillText(t,px,py)};
    var hl=function(y,w,col,dash){x.beginPath();x.setLineDash(dash||[]);x.lineWidth=w;x.strokeStyle=col;x.moveTo(pad,y);x.lineTo(W-pad,y);x.stroke();x.setLineDash([])};
    var y=pad+10;
    T(S.shop,pad,y+14,'400 32px '+FD,ACC);
    y+=14+40;
    T(b.custName,pad,y,'800 24px '+F,INK);
    y+=26;
    T(dmy(b.date),pad,y,'500 16px '+F,MUT);
    y+=22;
    var cNo=pad+4,cName=pad+54,rRate=W-pad-232,rKg=W-pad-118,rAmt=W-pad-4;
    T('क्र.',cNo,y+28,'800 17px '+F,MUT);T('सब्ज़ी',cName,y+28,'800 17px '+F,MUT);
    T('रेट',rRate,y+28,'800 17px '+F,MUT,'right');T('वज़न',rKg,y+28,'800 17px '+F,MUT,'right');T('राशि',rAmt,y+28,'800 17px '+F,MUT,'right');
    y+=rowH;hl(y,2,LINE);
    items.forEach(function(i,idx){
      var base=y+28;
      T(String(idx+1),cNo,base,'700 18px '+F,MUT);
      var fs=21;x.font='500 '+fs+'px '+F;while(x.measureText(i.name).width>(rRate-80-cName)&&fs>12){fs--;x.font='500 '+fs+'px '+F}
      T(i.name,cName,base,'500 '+fs+'px '+F,INK);
      T('₹'+fmtN(i.rate),rRate,base,'500 20px '+F,INK,'right');
      T(fmtN(i.kg)+' kg',rKg,base,'500 20px '+F,INK,'right');
      T('₹'+fmtN(i.amt),rAmt,base,'800 20px '+F,INK,'right');
      y+=rowH;hl(y,1,LINE);
    });
    y+=18;
    lines.forEach(function(l){
      y+=34;
      T(l[0],pad+4,y-8,(l[2]?'800 21px ':'500 20px ')+F,l[2]?INK:MUT);
      T(l[1],rAmt,y-8,'800 21px '+F,INK,'right');
    });
    y+=10;hl(y,1.5,LINE,[5,4]);
    y+=44;
    T('कुल बाकी',pad+4,y,'800 24px '+F,INK);
    T(fmt(b.due),rAmt,y+4,'400 38px '+FD,DUE,'right');
    y+=48;
    T('धन्यवाद',W/2,y,'500 17px '+F,MUT,'center');
    return new Promise(function(res,rej){cv.toBlob(function(bl){bl?res(bl):rej(new Error('img'))},'image/png')});
  });
}
function imgFallback(blob,name){
  var done=function(){toast('फोटो डाउनलोड हो गई। WhatsApp में जाकर भेजें')};
  var dl=function(){var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);done()};
  try{
    if(navigator.clipboard&&window.ClipboardItem){
      navigator.clipboard.write([new ClipboardItem({'image/png':blob})]).then(function(){toast('फोटो कॉपी हो गई। चैट में Paste (चिपकाएँ) करें')},dl);
    }else dl();
  }catch(e){dl()}
}
function copyBillImg(id){
  var b=S.bills.find(function(x){return x.id===id});if(!b)return;
  toast('फोटो बन रही है…');
  billImage(b).then(function(blob){imgFallback(blob,'bill-'+b.date+'-'+b.id+'.png')}).catch(function(){toast('फोटो नहीं बनी')});
}
function shareBillImg(id){
  var b=S.bills.find(function(x){return x.id===id});if(!b)return;
  toast('फोटो बन रही है…');
  billImage(b).then(function(blob){
    var name='bill-'+b.date+'-'+b.id+'.png',file=null;
    try{file=new File([blob],name,{type:'image/png'})}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:S.shop}).catch(function(e){if(!e||e.name!=='AbortError')imgFallback(blob,name)});
    }else imgFallback(blob,name);
  }).catch(function(){toast('फोटो नहीं बनी। टेक्स्ट वाला बटन इस्तेमाल करें')});
}
function custListMsg(){
  var L=['*'+S.shop+' - ग्राहक सूची*','तारीख: '+dmy(todayISO()),''],tot=0;
  S.customers.forEach(function(c,i){var b=balance(c);if(b>0)tot+=b;L.push((i+1)+') '+c.name+' | '+String(c.phone||'').replace(/\D/g,'')+' | '+(b<0?'एडवांस ₹'+fmtN(-b):'बाकी ₹'+fmtN(b)))});
  L.push('');L.push('*कुल बाकी: ₹'+fmtN(tot)+'*');
  return L.join('\n');
}
function toast(t){var e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},2200)}
function fallbackCopy(t){var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0;height:1px';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();toast(ok?'कॉपी हो गया':'कॉपी नहीं हुआ')}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('कॉपी हो गया')},function(){fallbackCopy(t)})}else fallbackCopy(t)}
function askDel(t,fn,lbl){
  if(t.dataset.arm==='1'){fn();return}
  t.dataset.arm='1';t.dataset.orig=t.textContent;t.textContent=lbl||'पक्का हटाएँ?';t.classList.add('armed');
  setTimeout(function(){if(t.isConnected){t.dataset.arm='';t.textContent=t.dataset.orig;t.classList.remove('armed')}},3500);
}

function hisaabTab(){
  var td=todayISO(),sale=0,got=0,cnt=0;
  S.bills.forEach(function(b){if(b.date===td){sale+=billVeg(b);got+=b.paid;cnt++}});
  S.payments.forEach(function(p){if(p.date===td)got+=p.amt});
  var dues=S.customers.map(function(c){return {c:c,b:balance(c)}}).filter(function(x){return x.b>0}).sort(function(a,b){return b.b-a.b});
  var totDue=dues.reduce(function(s,x){return s+x.b},0);
  var hist=S.bills.slice().sort(function(a,b){return b.ts-a.ts}).slice(0,40);
  return '<h2>आज का हिसाब</h2><div class="stat"><div><b>'+fmt(sale)+'</b><span>आज बिका ('+cnt+' बिल)</span></div><div><b>'+fmt(got)+'</b><span>आज मिला</span></div><div><b>'+fmt(totDue)+'</b><span>कुल बाकी</span></div></div>'+
    '<h2>उधार (बाकी)</h2><section class="card">'+(dues.length?dues.map(function(x){
      var msg='नमस्ते '+x.c.name+', आपका ₹'+fmtN(x.b)+' बाकी है। - '+S.shop;
      return '<div class="ud"><div class="top"><b>'+esc(x.c.name)+'</b><span class="pill">'+fmt(x.b)+'</span></div><div class="act"><input id="pay-'+x.c.id+'" inputmode="decimal" placeholder="पैसा मिला ₹" aria-label="'+esc(x.c.name)+' से मिला पैसा"><button class="btn" data-act="pay" data-id="'+x.c.id+'">जमा करें</button><button class="btn ghost" data-act="clearBal" data-id="'+x.c.id+'">पूरा मिला</button></div><a class="small" href="'+waLink(x.c.phone,msg)+'" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700">WhatsApp पर याद दिलाएँ</a></div>'}).join(''):'<div class="empty">किसी का बाकी नहीं है।</div>')+'</section>'+
    '<h2>पुराने बिल</h2><section class="card">'+(hist.length?hist.map(function(b){return '<div class="hist"><button class="open" data-act="viewBill" data-id="'+b.id+'"><span class="t">'+esc(b.custName)+'</span><br><small>'+dmy(b.date)+' · बिल '+fmt(b.total)+' · मिले '+fmt(b.paid)+'</small></button><button class="link" data-act="delBill" data-id="'+b.id+'">हटाएँ</button></div>'}).join(''):'<div class="empty">अभी कोई बिल सेव नहीं हुआ।</div>')+'</section>'+

    '<p class="small" style="margin:0 0 6px">ग्राहक सूची और बाकी WhatsApp पर भेजकर रख लें। कभी डेटा चला जाए तो वहीं से वापस डाल सकते हैं।</p><div class="acts"><a class="btn wa" href="'+waLink('',custListMsg())+'" target="_blank" rel="noopener">सूची WhatsApp पर भेजें</a></div><label class="lbl" for="listBox" style="margin-top:12px">सूची से ग्राहक वापस डालें</label><textarea id="listBox" placeholder="WhatsApp से कॉपी की हुई सूची यहाँ चिपकाएँ"></textarea><button class="btn ghost" style="margin:8px 0 14px;width:100%" data-act="restoreList">ग्राहक वापस डालें</button><hr style="border:0;border-top:1px solid var(--line);margin:0 0 12px">'+

    '<label class="lbl" for="backupBox" style="margin-top:12px">बैकअप वापस डालें</label><textarea id="backupBox" placeholder="यहाँ बैकअप का टेक्स्ट चिपकाएँ"></textarea><button class="btn ghost" style="margin-top:8px;width:100%" data-act="restore">वापस डालें</button></section>';

function renderHeader(){set('#shopName',S.shop);set('#dateLine',dmy(todayISO())+(cloud.local?' · बिना लॉगिन, डेटा सिर्फ इसी फोन में':''))}
function updateRow(row){
  var id=row.dataset.id,kg=num(ui.w[id]),r=num(row.querySelector('.rate').value);
  if(row.querySelector('.rate').value.trim()==='')r=(vegById(id)||{rate:0}).rate;
  row.querySelector('.amt').textContent=kg>0?fmt(kg*r):'';
  row.classList.toggle('on',kg>0);
}
function updateTotals(){
  var t=calc(),c=cust();
  set('#sSub',fmt(t.sub));set('#sTotal',fmt(t.total));set('#sDue',fmt(t.due));set('#stTotal',fmt(t.total));
  var bi=$('#baki');if(bi&&!ui.bakiTouched)bi.value=ui.baki;
  var bl=$('#balLine');if(bl&&c){var pb=balance(c);bl.innerHTML=pb>0?'पिछला बाकी: <b>'+fmt(pb)+'</b>':pb<0?'एडवांस जमा: '+fmt(-pb):'कोई बाकी नहीं'}
}
function render(){
  $('#tabs').hidden=false;
  document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===ui.tab)});
  var m=$('#main');
  if(ui.tab==='bill')m.innerHTML=ui.view==='preview'?billPreview():billEdit();
  else if(ui.tab==='rates')m.innerHTML=ratesTab();
  else if(ui.tab==='cust')m.innerHTML=custTab();
  else m.innerHTML=hisaabTab();
  var showBar=ui.tab==='bill'&&ui.view==='edit'&&S.customers.length>0;
  $('#totbar').hidden=!showBar;
  if(showBar)updateTotals();
  renderHeader();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab],[data-act]');if(!t)return;
  if(t.dataset.tab){ui.tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  var a=t.dataset.act,id=t.dataset.id,row=t.closest('.row');
  if(a==='login'){doLogin();return}
  if(a==='logout'){doLogout();return}
  if(a==='shareImg'){shareBillImg(id);return}
  if(a==='copyImg'){copyBillImg(id);return}
  if(a==='inc'||a==='dec'){
    var rid=row.dataset.id,cur=num(ui.w[rid]),nx=Math.max(0,cur+(a==='inc'?1:-1));
    ui.w[rid]=nx>0?String(nx):'';row.querySelector('.kg').value=ui.w[rid];updateRow(row);updateTotals();
  }else if(a==='resetrate'){
    var c=cust(),rid2=row.dataset.id;delete c.rates[rid2];save();
    row.querySelector('.rate').value=vegById(rid2).rate;row.querySelector('.tagwrap').innerHTML='';updateRow(row);updateTotals();
  }else if(a==='togglePick'){
    ui.picking=!ui.picking;var pk=$('#picker');if(pk)pk.hidden=!ui.picking;
    t.textContent=ui.picking?'सब्ज़ी की लिस्ट बंद करें':'+ सब्ज़ी चुनें';
  }else if(a==='pick'){
    var pv=vegById(id);if(!pv)return;
    if(ui.sel.indexOf(id)>=0){toast(pv.name+' पहले से बिल में है');return}
    ui.sel.push(id);t.classList.add('on');
    $('#rows').insertAdjacentHTML('beforeend',rowHTML(pv,cust()));
    var re=$('#rowsEmpty');if(re)re.hidden=true;
    toast(pv.name+' जुड़ गई');
  }else if(a==='rm'){
    var rid3=row.dataset.id;ui.sel=ui.sel.filter(function(x){return x!==rid3});delete ui.w[rid3];row.remove();
    var ch=document.querySelector('.chip[data-id="'+rid3+'"]');if(ch)ch.classList.remove('on');
    var re2=$('#rowsEmpty');if(re2)re2.hidden=ui.sel.length>0;updateTotals();
  }else if(a==='goCust'){ui.tab='cust';render();window.scrollTo(0,0)}
  else if(a==='toSummary'){var s=$('#sumcard');if(s)s.scrollIntoView({behavior:'smooth',block:'start'})}
  else if(a==='saveBill'){
    var tt=calc();if(!tt.items.length){toast('पहले सब्ज़ी का वज़न डालें');return}
    var cc=cust();
    var b={id:uid(),ts:Date.now(),date:todayISO(),custId:cc.id,custName:cc.name,items:tt.items,sub:tt.sub,baki:tt.baki,minus:0,total:tt.total,prev:tt.baki,paid:tt.paid,due:tt.due};
    S.bills.push(b);save();cloudPutBill(b);ui.w={};ui.sel=[];ui.picking=false;ui.baki='';ui.bakiTouched=false;ui.paid='';ui.view='preview';ui.previewId=b.id;render();window.scrollTo(0,0);toast('बिल सेव हो गया');
  }else if(a==='newBill'){ui.view='edit';ui.baki='';ui.bakiTouched=false;ui.paid='';render();window.scrollTo(0,0)}
  else if(a==='viewBill'){ui.tab='bill';ui.view='preview';ui.previewId=id;render();window.scrollTo(0,0)}
  else if(a==='copyBill'){var bb=S.bills.find(function(x){return x.id===id});if(bb)copyText(billMsg(bb))}
  else if(a==='addVeg'){
    var n=$('#newVegName').value.trim(),r=num($('#newVegRate').value);
    if(!n){toast('सब्ज़ी का नाम लिखें');return}
    S.veg.unshift({id:uid(),name:n,rate:r});save();render();toast('सब्ज़ी जुड़ गई');
  }else if(a==='delVeg'){askDel(t,function(){S.veg=S.veg.filter(function(v){return v.id!==id});ui.sel=ui.sel.filter(function(x){return x!==id});delete ui.w[id];save();render()})}
  else if(a==='addCust'){
    var cn=$('#newCustName').value.trim();
    if(!cn){toast('ग्राहक का नाम लिखें');return}
    var nc={id:uid(),name:cn,phone:$('#newCustPhone').value.trim(),opening:num($('#newCustOpen').value),rates:{}};
    S.customers.push(nc);ui.custId=nc.id;save();render();toast('ग्राहक जुड़ गया');
  }else if(a==='delCust'){askDel(t,function(){S.customers=S.customers.filter(function(c){return c.id!==id});if(ui.custId===id)ui.custId=null;save();render()})}
  else if(a==='clearBal'){
    var cb=S.customers.find(function(c){return c.id===id});if(!cb)return;
    var bal=balance(cb);if(bal<=0){toast('कोई बाकी नहीं है');return}
    askDel(t,function(){var pc={id:uid(),custId:id,date:todayISO(),amt:bal};S.payments.push(pc);save();cloudPutPay(pc);render();toast(cb.name+' का हिसाब साफ')},'पक्का साफ करें?');
  }
  else if(a==='restoreList'){
    var txt=($('#listBox')||{}).value||'',n=0;
    txt.split(/\r?\n/).forEach(function(line){
      var m=line.match(/^\s*\d+\)\s*(.+?)\s*\|\s*(\d*)\s*\|\s*(बाकी|एडवांस)\s*₹?\s*([\d,\.]+)/);
      if(!m)return;
      var nm=m[1].trim();if(S.customers.some(function(c){return c.name===nm}))return;
      var amt=num(m[4].replace(/,/g,''));
      S.customers.push({id:uid(),name:nm,phone:m[2],opening:m[3]==='बाकी'?amt:-amt,rates:{}});n++;
    });
    if(n){save();render();toast(n+' ग्राहक वापस आ गए')}else toast('सूची नहीं मिली या ग्राहक पहले से हैं');
  }
  else if(a==='resetCustRate'){var cu=S.customers.find(function(c){return c.id===id});if(cu){delete cu.rates[t.dataset.v];save();render()}}
  else if(a==='pay'){
    var amt=num(($('#pay-'+id)||{}).value);if(amt<=0){toast('रकम लिखें');return}
    var po={id:uid(),custId:id,date:todayISO(),amt:amt};S.payments.push(po);save();cloudPutPay(po);render();toast('जमा हो गया');
  }else if(a==='delBill'){askDel(t,function(){S.bills=S.bills.filter(function(b){return b.id!==id});save();cloudDelBill(id);render()})}
  else if(a==='backupCopy'){copyText(JSON.stringify(S))}
  else if(a==='restore'){
    try{var o=JSON.parse($('#backupBox').value);if(!o||!Array.isArray(o.veg)||!Array.isArray(o.customers)||!Array.isArray(o.bills))throw 0;o.payments=o.payments||[];S=o;save();cloudReplaceAll();ui.custId=null;ui.w={};render();toast('बैकअप वापस आ गया')}
    catch(err){toast('बैकअप सही नहीं है')}
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='filter'){var q=t.value.trim();document.querySelectorAll('#chips .chip').forEach(function(r){r.hidden=!!q&&r.textContent.indexOf(q)<0});return}
  if(t.id==='baki'){ui.bakiTouched=true;ui.baki=t.value;updateTotals();return}
  if(t.id==='paid'){ui.paid=t.value;updateTotals();return}
  var row=t.closest('.row');if(!row)return;
  var id=row.dataset.id;
  if(t.classList.contains('kg')){ui.w[id]=t.value;updateRow(row);updateTotals()}
  else if(t.classList.contains('rate')){
    var c=cust(),v=vegById(id);if(!c||!v)return;
    if(t.value.trim()===''||num(t.value)===v.rate)delete c.rates[id];else c.rates[id]=num(t.value);
    save();
    row.querySelector('.tagwrap').innerHTML=c.rates[id]!=null?'<button class="tag" data-act="resetrate">खास रेट ×</button>':'';
    updateRow(row);updateTotals();
  }
});
document.addEventListener('change',function(e){
  var t=e.target,id=t.dataset?t.dataset.id:null;
  if(t.id==='custSel'){ui.custId=t.value;ui.bakiTouched=false;ui.baki='';render();return}
  if(t.id==='shop'){S.shop=t.value.trim()||'पांडे जी सब्ज़ी';save();renderHeader();return}
  if(t.classList.contains('vname')){var v=vegById(id);if(v&&t.value.trim()){v.name=t.value.trim();save()}return}
  if(t.classList.contains('vrate')){var v2=vegById(id);if(v2){v2.rate=num(t.value);save()}return}
  if(t.classList.contains('cname')){var c=S.customers.find(function(x){return x.id===id});if(c&&t.value.trim()){c.name=t.value.trim();save()}return}
  if(t.classList.contains('cphone')){var c2=S.customers.find(function(x){return x.id===id});if(c2){c2.phone=t.value.trim();save()}return}
});

var FB_CONFIG={apiKey:"AIzaSyDC9HS4IieDPbs12coaU_xJDk4GSJywEUM",authDomain:"sabzi-hisab.firebaseapp.com",projectId:"sabzi-hisab",storageBucket:"sabzi-hisab.firebasestorage.app",messagingSenderId:"1092632994221",appId:"1:1092632994221:web:146b5cdd185bfa32918124"};
var auth=null,db=null,coreT=null;
var clean=function(o){return JSON.parse(JSON.stringify(o))};
function cloudErr(){toast('ऑनलाइन सेव नहीं हुआ। इंटरनेट देखें।')}
function cloudSaveNow(){
  clearTimeout(coreT);coreT=null;
  if(!cloud.on||!cloud.ref)return Promise.resolve();
  var p=cloud.ref.collection('store').doc('core').set(clean({shop:S.shop,veg:S.veg,customers:S.customers,vegMerged:true,updated:Date.now()}));
  p.catch(cloudErr);return p;
}
function cloudSaveCore(){clearTimeout(coreT);coreT=setTimeout(cloudSaveNow,500)}
function cloudPut(col,o){if(cloud.on)cloud.ref.collection(col).doc(o.id).set(clean(o)).catch(cloudErr)}
function cloudPutBill(b){cloudPut('bills',b)}
function cloudPutPay(p){cloudPut('payments',p)}
function cloudDelBill(id){if(cloud.on)cloud.ref.collection('bills').doc(id).delete().catch(cloudErr)}
function cloudReplaceAll(){
  if(!cloud.on)return;
  cloudSaveNow();
  ['bills','payments'].forEach(function(col){
    var arr=S[col],keep={};arr.forEach(function(x){keep[x.id]=1});
    cloud.ref.collection(col).get().then(function(q){q.docs.forEach(function(d){if(!keep[d.id])d.ref.delete()})}).catch(cloudErr);
    arr.forEach(function(x){cloudPut(col,x)});
  });
}
function acct(){
  return cloud.on?'<p class="small" style="margin:0 0 8px">लॉगिन: '+esc(cloud.email)+' · डेटा ऑनलाइन सेव है</p><button class="btn ghost" style="width:100%;margin-bottom:14px" data-act="logout">लॉग आउट</button>':'';
}
function showOnly(html){$('#tabs').hidden=true;$('#totbar').hidden=true;$('#main').innerHTML=html;renderHeader()}
function loginScreen(msg){
  showOnly('<section class="card login"><h2 style="margin-top:0">लॉगिन करें</h2><p class="small">अपने Gmail से लॉगिन करें। ग्राहक और हिसाब का डेटा ऑनलाइन सेव रहेगा, फोन या कंप्यूटर बदलने पर भी वापस मिलेगा।</p><button class="btn big" data-act="login">Google से लॉगिन करें</button>'+(msg?'<p class="bal"><b>'+esc(msg)+'</b></p>':'')+'</section>');
}
function doLogin(){
  if(!auth)return;
  var prov=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(prov).catch(function(e){
    var c=(e&&e.code)||'';
    if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'){auth.signInWithRedirect(prov);return}
    if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return;
    loginScreen(c==='auth/unauthorized-domain'?'Firebase में इस वेबसाइट का पता (domain) जोड़ना बाकी है।':'लॉगिन नहीं हुआ। फिर कोशिश करें। ('+c+')');
  });
}
function doLogout(){cloudSaveNow();if(auth)auth.signOut()}
function loadCloud(){
  var c=cloud.ref.collection('store').doc('core');
  return Promise.all([c.get(),cloud.ref.collection('bills').get(),cloud.ref.collection('payments').get()]).then(function(r){
    var cs=r[0];
    if(cs.exists){
      var d=cs.data();
      S={shop:d.shop||'पांडे जी सब्ज़ी',vegMerged:true,veg:d.veg||[],customers:d.customers||[],
        bills:r[1].docs.map(function(x){return x.data()}),payments:r[2].docs.map(function(x){return x.data()})};
      cloud.on=true;return;
    }
    var loc=null,migrated=false;
    try{migrated=!!localStorage.getItem('sabzi_migrated')}catch(e){}
    if(!migrated)loc=load();
    var real=!!loc&&(loc.bills.length>0||loc.customers.some(function(x){return x.name.indexOf('(उदाहरण)')<0}));
    if(real){
      loc.customers=loc.customers.filter(function(x){return x.name.indexOf('(उदाहरण)')<0||loc.bills.some(function(b){return b.custId===x.id})});
      S=loc;
    }else S=seed();
    cloud.on=true;
    var done=cloudSaveNow();
    S.bills.forEach(function(b){cloudPutBill(b)});S.payments.forEach(function(p){cloudPutPay(p)});
    if(real){
      done.then(function(){try{localStorage.setItem('sabzi_migrated','1')}catch(e){}}).catch(function(){});
      toast('पुराना डेटा ऑनलाइन सेव हो गया');
    }
  });
}
document.addEventListener('visibilitychange',function(){if(document.hidden&&coreT)cloudSaveNow()});

try{
  if(window.firebase&&firebase.initializeApp){
    if(!firebase.apps||!firebase.apps.length)firebase.initializeApp(FB_CONFIG);

if(fbOk){
  showOnly('<div class="empty">लोड हो रहा है…</div>');

    if(!u){
      cloud.on=false;cloud.ref=null;cloud.email='';cloud.uid=null;
      S=seed();ui.tab='bill';ui.view='edit';ui.custId=null;ui.w={};ui.sel=[];ui.picking=false;ui.baki='';ui.bakiTouched=false;ui.paid='';ui.previewId=null;
      loginScreen();return;
    }
    cloud.uid=u.uid;cloud.email=u.email||'';cloud.ref=db.collection('users').doc(u.uid);
    showOnly('<div class="empty">डेटा लोड हो रहा है…</div>');
    loadCloud().then(function(){render()}).catch(function(){cloud.on=false;loginScreen('डेटा लोड नहीं हुआ। इंटरनेट देखकर फिर कोशिश करें।')});
  });
}else{cloud.local=true;render()}
})();
